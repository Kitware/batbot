[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "batbot"
dynamic = ["version"]
description = "Machine Learning app for the Kitware BatAI Project"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Kitware", email = "vision@kitware.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click",
    "librosa",
    "matplotlib",
    "numpy",
    "onnxruntime",
    "opencv-python-headless",
    "pooch",
    "pyastar2d>=1.1.1",
    "rich",
    "scikit-image",
    "scipy",
    "shapely",
    "tqdm",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
    "pytest-cov",
    "pytest-random-order",
    "xdoctest",
]
docs = [
    "Sphinx>=5,<6",
    "sphinx-click",
    "sphinx-rtd-theme",
    "standard-imghdr",
]
performance = [
    "scikit-learn",
]

[project.scripts]
batbot = "batbot.batbot_cli:cli"

[project.urls]
Documentation = "https://batbot.readthedocs.io"
Issues = "https://github.com/Kitware/batbot/issues"
Repository = "https://github.com/Kitware/batbot"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "batbot._version.__version__"}

[tool.setuptools.packages.find]
include = ["batbot*"]

[tool.setuptools.package-data]
batbot = ["py.typed"]
"batbot.classifier" = ["models/onnx/*.onnx"]

[tool.pytest.ini_options]
minversion = "8.4.2"
addopts = """
    -v
    -p no:doctest
    --xdoctest
    --xdoctest-style=google
    --random-order
    --random-order-bucket=global
    --cov=batbot
    --cov-report=html
    -m "not separate"
    --durations-min=1.0
    --color=yes
    --code-highlight=yes
    --show-capture=log
    -ra
"""
testpaths = ["batbot", "tests"]
filterwarnings = ["default"]

[tool.coverage.run]
branch = true
source = ["batbot"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "# NOCC",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 1
ignore_errors = true
omit = [
    "*/__pycache__/*",
    "tests/*",
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E501"]
exclude = [".git"]
