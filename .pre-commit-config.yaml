# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
        name: Hadolint for Dockerfiles
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        name: pyupgrade
        description: Run PyUpgrade on Python code.
        args: [--py311-plus]
  - repo: https://github.com/pycqa/isort
    rev: 9.0.0b5
    hooks:
      - id: isort
        args: [--settings-path, pyproject.toml]
        name: isort
        description: Run import sorting (isort) on Python code.
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        name: Black for Python code formatting
        language_version: python3
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: Flake8 for Python code linting
        additional_dependencies: [flake8-pyproject==1.2.4]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: double-quote-string-fixer
        name: Format single quotes
      - id: check-yaml
        name: Format YAML files
        args: ['--unsafe']
      - id: check-toml
        name: Format TOML files
      - id: trailing-whitespace
        name: Fix Whitespace
      - id: mixed-line-ending
        name: Fix EOL
        args: ['--fix=lf']
      - id: end-of-file-fixer
        name: Fix EOF
      - id: check-executables-have-shebangs
        name: Ensure executables have directive
      - id: check-shebang-scripts-are-executable
        name: Ensure directives are executable
      - id: detect-private-key
        name: Ensure no private keys
      - id: check-ast
