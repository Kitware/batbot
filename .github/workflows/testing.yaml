name: Testing

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files
        env:
          SKIP: hadolint

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      MPLBACKEND: Agg
      PYTHONUTF8: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cpu,test]"
          python -m pip check
          python -c "import onnxruntime; print('ONNX Runtime:', onnxruntime.__version__)"

      - name: Run tests and coverage
        run: pytest --cov-report=xml --random-order-seed=1

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.BATBOT_CODECOV_TOKEN }}
          files: ./coverage/coverage.xml
          env_vars: OS,PYTHON
          fail_ci_if_error: true

  gpu-install:
    name: NVIDIA runtime install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install GPU dependencies in isolation
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gpu]"
          python -m pip check
      # Hosted machines have no NVIDIA hardware. Kernel execution is checked
      # separately on the configured GPU runner in the Docker workflow.
      - name: Verify installed GPU distribution using CPU inference
        run: python -I scripts/smoke_install.py --runtime gpu --provider cpu

  notebooks:
    name: Notebook tutorials (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[cpu,test,notebook]"
      - run: python -m pip check
      - name: Validate source hygiene and tutorial helpers
        run: |
          python scripts/check_notebooks.py
          python -m pytest tests/test_notebook_helpers.py --no-cov
      - name: Execute notebooks without network setup or user uploads
        run: python scripts/check_notebooks.py --execute --output-dir artifacts/notebooks/validation
      - name: Preserve executed notebooks, reports, and figures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: notebook-examples-${{ matrix.python-version }}
          path: artifacts/notebooks/validation
          if-no-files-found: ignore
          retention-days: 7

  documentation:
    name: Developer documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[cpu,docs]"
      - run: python -m pip check
      # Validate local documentation, not the uptime of external inventories.
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
