name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Container (${{ matrix.target }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu
            platform: linux/amd64
            cache: cpu-amd64
          - target: cpu
            platform: linux/arm64
            cache: cpu-arm64
          - target: gpu
            platform: linux/amd64
            cache: gpu-amd64
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: batbot:test
          cache-from: type=gha,scope=batbot-${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=batbot-${{ matrix.cache }}
      - name: Check CLI and installed dependencies
        run: |
          docker run --rm --platform ${{ matrix.platform }} batbot:test --help
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python batbot:test -m pip check
      # Standard hosted runners have no NVIDIA hardware. Even the GPU image
      # must work on CPU and must contain only its selected runtime package.
      - name: Check non-root read-only container, WAV workers, and model
        run: >-
          docker run --rm --platform ${{ matrix.platform }}
          --read-only --tmpfs /tmp --entrypoint python batbot:test
          -I /usr/local/share/batbot/smoke_install.py
          --runtime ${{ matrix.target }} --provider cpu

  gpu-hardware:
    name: NVIDIA GPU kernel execution
    needs: test
    # Only trusted pushes/manual runs can reach an organization's GPU runner.
    if: >-
      vars.BATBOT_GPU_RUNNER != '' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ fromJSON(vars.BATBOT_GPU_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Check host NVIDIA driver
        run: nvidia-smi
      - name: Build CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: gpu
          platforms: linux/amd64
          load: true
          tags: batbot:gpu-test
          cache-from: type=gha,scope=batbot-gpu-amd64
      - name: Require actual CUDA inference inside Docker
        run: >-
          docker run --rm --gpus all --read-only --tmpfs /tmp
          --entrypoint python batbot:gpu-test
          -I /usr/local/share/batbot/smoke_install.py
          --runtime gpu --provider cuda

  publish:
    name: Publish ${{ matrix.target }} image
    needs: [test, gpu-hardware]
    if: >-
      always() && github.event_name == 'push' &&
      needs.test.result == 'success' &&
      (needs.gpu-hardware.result == 'success' || needs.gpu-hardware.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu
            platforms: linux/amd64,linux/arm64
            suffix: ''
          - target: gpu
            platforms: linux/amd64
            suffix: -gpu
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.BATBOT_DOCKERHUB_USERNAME }}
          password: ${{ secrets.BATBOT_DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            kitware/batbot
            ghcr.io/kitware/batbot
          flavor: suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Publish tested images
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
