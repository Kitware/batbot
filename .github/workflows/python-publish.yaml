name: Python distributions

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  build:
    name: Build wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build --outdir dist/ .
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  test-wheel:
    name: Installed wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - name: Checkout the standalone smoke test
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/smoke_install.py
            pyproject.toml
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          for wheel in dist/*.whl; do python -m pip install "${wheel}[cpu]"; done
          python -m pip check

      - name: Smoke test wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c "import batbot; assert batbot.__version__"
          batbot --help
          python -I "$GITHUB_WORKSPACE/scripts/smoke_install.py"
      - name: Verify Apple CoreML
        if: runner.os == 'macOS'
        run: python -I scripts/smoke_install.py --provider coreml

  publish:
    name: Publish to PyPI
    needs: test-wheel
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/batbot
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
