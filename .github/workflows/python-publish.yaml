name: Python distributions

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag (for example, v0.2.0); blank validates the selected ref'
        type: string
        required: false
        default: ''
      publish:
        description: 'Publish the release_tag to PyPI after wheel validation'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.release_tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  MPLBACKEND: Agg
  PYTHONUTF8: '1'

jobs:
  prepare:
    name: Resolve and validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      # Keep release tooling from this workflow's ref, even when building an
      # older tag that does not contain workflow_dispatch or prepare_release.py.
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Resolve source and check tag against package version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH: ${{ inputs.publish }}
        run: python scripts/prepare_release.py

  build:
    name: Build wheel and source distribution
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build --outdir dist/ .
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test-wheel:
    name: Installed wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [prepare, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out standalone installation checks
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            scripts/smoke_install.py
            pyproject.toml
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          for wheel in dist/*.whl; do python -m pip install "${wheel}[cpu]"; done
          python -m pip check

      - name: Smoke test wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c "import batbot; assert batbot.__version__"
          batbot --help
          python -I "$GITHUB_WORKSPACE/scripts/smoke_install.py"

      - name: Verify Apple CoreML
        if: runner.os == 'macOS'
        run: python -I scripts/smoke_install.py --provider coreml

  publish:
    name: Publish to PyPI
    needs: [prepare, test-wheel]
    if: >-
      needs.prepare.outputs.publish == 'true' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.release_tag != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/batbot
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
